<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rusty Model Sheet</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bangers&family=Patrick+Hand&display=swap">
<style>
  :root { --paper: #efe4c8; --ink: #15100d; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --paper: #efe4c8; } }
  body { background: var(--paper); color: var(--ink); font-family: "Patrick Hand", sans-serif; margin: 0; padding: 12px; }
  h1 { font-family: Bangers, sans-serif; letter-spacing: 2px; margin: 0 0 8px; }
  svg { width: 100%; height: auto; display: block; background: #f6eedb; border: 3px solid var(--ink); }
</style>
</head>
<body>
<h1>Rusty: model sheet (open from the repo root via http.server)</h1>
<div id="sheet"></div>
<script src="../model.js"></script>
<script>
(function () {
  var R = window.RUSTY, k = R.ctx("ms"), s = "";
  function label(t, x, y) { return '<text x="' + x + '" y="' + y + '" font-family="Patrick Hand" font-size="22" text-anchor="middle">' + t + "</text>"; }
  /* Row 1: Rusty turnaround + wear */
  var row = 470;
  [["stand", "work", 0, "neutral"], ["mop", "work", 0, "neutral"], ["walkCarry", "suit", 0, "resolve"], ["sit", "suit", 0, "resigned"],
   ["mop", "eternal", .4, "resigned"], ["mop", "eternal", .7, "resigned"], ["mop", "eternal", 1, "resigned"]].forEach(function (a, i) {
    var x = 120 + i * 200;
    s += R.person(k, { x: x, y: row, s: 1, pose: a[0], outfit: a[1], wear: a[2], expr: a[3], light: 1,
      carry: a[0] === "walkCarry" ? R.woodRabbit(k, { s: .5 }) : null });
    s += label(a[0] + " / " + a[1] + " / w" + a[2], x, row + 40);
  });
  /* Row 2: Rusty heads, expressions */
  var ex = ["neutral", "tender", "sad", "fear", "resolve", "anger", "resigned", "anguish", "cry", "drunk", "closed"];
  ex.forEach(function (e, i) {
    var x = 80 + i * 128;
    s += R.head(k, { x: x, y: 640, s: .72, expr: e, turn: .2, light: 1, ch: e === "drunk" ? "rustyYoung" : "rusty" });
    s += label(e, x, 720);
  });
  /* Row 3: wear progression heads */
  [0, .25, .5, .75, 1].forEach(function (w, i) {
    var x = 100 + i * 150;
    s += R.head(k, { x: x, y: 840, s: .9, expr: "resigned", wear: w, light: -1, turn: -.2 });
    s += label("wear " + w, x, 930);
  });
  /* Danny, Jess, Danny18 */
  s += R.person(k, { x: 900, y: 1180, ch: "danny", outfit: "danny", pose: "stand", expr: "sad", light: 1, flip: -1 });
  s += R.person(k, { x: 1060, y: 1180, ch: "jess", outfit: "jess", pose: "stand", expr: "tender", light: 1, flip: -1 });
  s += R.person(k, { x: 1220, y: 1180, ch: "danny18", outfit: "gown", pose: "stand", expr: "anger", hat: "mortar" });
  s += R.person(k, { x: 1380, y: 1180, ch: "rustyYoung", outfit: "coat", pose: "stand", expr: "drunk", stoop: -6 });
  s += label("Danny 28 / Jess / Danny 18 / Rusty -10y", 1140, 1220);
  /* Players + rabbit + props */
  s += R.player(k, { x: 120, y: 1560, pose: "stand", variant: 0 });
  s += R.player(k, { x: 340, y: 1560, pose: "wave", variant: 1 });
  s += R.player(k, { x: 560, y: 1560, pose: "point", variant: 2 });
  s += R.monsterRabbit(k, { x: 900, y: 1560 });
  s += R.woodRabbit(k, { x: 1180, y: 1540, s: 1.6 });
  s += R.bucket(k, { x: 1350, y: 1540, water: "#7a1414" });
  s += label("The Players (3 variants) · rabbit-thing · the carved rabbit · bucket", 760, 1600);
  /* Row: back views, three-quarter seated poses, kneels */
  var r5 = 2120;
  s += R.personBack(k, { x: 110, y: r5, pose: "stand", outfit: "work", light: 1, rim: "#e0a030", headTurn: .3 });
  s += R.personBack(k, { x: 290, y: r5, pose: "walk", outfit: "suit", stoop: 10 });
  s += R.personBack(k, { x: 460, y: r5, pose: "slump", outfit: "eternal", wear: 1, light: -1 });
  s += R.personBack(k, { x: 620, y: r5, pose: "walk", ch: "danny", outfit: "danny" });
  s += label("R.personBack: stand+rim / walk suit / slump w1 / Danny", 370, r5 + 40);
  s += R.person(k, { x: 790, y: r5, pose: "sit3q", outfit: "suit", expr: "tender", light: 1 });
  s += R.person(k, { x: 1010, y: r5, pose: "sitChin", ch: "danny", outfit: "danny", expr: "sad", light: 1 });
  s += R.person(k, { x: 1230, y: r5, pose: "sit3q", ch: "jess", outfit: "jess", expr: "smile", light: -1, flip: -1 });
  s += R.person(k, { x: 1380, y: r5, pose: "sitSlump", outfit: "suit", expr: "resigned", light: 1 });
  s += label("sit3q / sitChin / sit3q (Jess, flip) / sitSlump", 1100, r5 + 40);
  /* Row: hands + kneels */
  var r6 = 2560;
  s += R.person(k, { x: 120, y: r6, pose: "kneel", expr: "tender", light: 1 });
  s += R.person(k, { x: 330, y: r6, pose: "kneel3q", expr: "tender", light: 1, look: 1 });
  s += label("kneel / kneel3q", 230, r6 + 40);
  s += R.fist(k, { x: 640, y: r6 - 200, s: .9, ring: true });
  s += R.fist(k, { x: 640, y: r6 - 60, s: .9, sleeve: "#6c4f37" });
  s += R.grip(k, { x: 960, y: r6 - 200, s: .8, ring: true });
  s += R.grip(k, { x: 960, y: r6 - 60, s: .8, wear: 1, sleeve: "#6b6e66" });
  s += R.openHand(k, { x: 1100, y: r6 - 150, s: 1, ring: true, sleeve: "#7f8b6c" });
  s += R.openHand(k, { x: 1300, y: r6 - 150, s: 1, curl: .5, wear: .8, tremble: true });
  s += label("R.fist (ring / sleeve) · R.grip (work / wear 1) · R.openHand (ring / curl .5, wear .8)", 900, r6 + 40);
  document.getElementById("sheet").innerHTML = '<svg viewBox="0 0 1500 2620" xmlns="http://www.w3.org/2000/svg">' + R.defs(k) + s + "</svg>";
})();
</script>
</body>
</html>
